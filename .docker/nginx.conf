server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text responses at the app tier. Belt-and-suspenders: the shared
    # edge Caddy already compresses (and skips already-encoded upstreams).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the Spring Boot server (compose service name).
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite emits content-hashed bundles under /assets/ — filenames change on
    # every build, so a year-long immutable cache is always safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell document must revalidate every visit so deploys are picked up
    # immediately (try_files falls back here for SPA routes too).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA history fallback: unknown paths serve the app, which renders the 404 view.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
