# CI — same contract as the devcontainer definition-of-done, per package:
# server: mvn -B verify · client: npm ci → test → build. Tests run against
# whatever each package's suite needs (the server suite uses Testcontainers
# where real engines are required — no service containers wired here yet).
# `verify` (not `test`) so the JaCoCo LINE-coverage gate — bound to the verify
# phase in server/pom.xml — is enforced in CI exactly as in local full runs.
# Hygiene: pushes trigger only on master (pull_request already covers branch
# work, so same-repo PRs stop double-running), superseded runs cancel, and
# both jobs carry an explicit wall-clock ceiling.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: mvn -B verify

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
