# Topic 27 (internationalization) — the guide's message bundles.
#
# This is the BASE bundle: the fallback floor every locale falls through to
# when its own bundle misses a key. It carries a COMPLETE English copy (the
# source language of this codebase), so a missing translation degrades to
# English rather than to an exception — the standard failure mode for
# partially translated applications.
#
# Bundle format notes (the .properties contract):
# - lines starting # are comments; keys and values split on the FIRST
#   unescaped '=' (or ':'), so colons inside values are safe;
# - values are literal UTF-8 here (JDK 9+ PropertyResourceBundle and Boot's
#   ResourceBundleMessageSource both read UTF-8; spring.messages.encoding
#   restates it). The historical ISO-8859-1 + \uXXXX escape era is why older
#   codebases look like \u00fc soup — escapes still work and remain the safe
#   choice for toolchains you do not control;
# - any value fetched WITH arguments goes through java.text.MessageFormat,
#   where a lone apostrophe is the QUOTE ESCAPE: "Developer's" formats with
#   args as "Developers". Values that take {0}-style parameters must double
#   their apostrophes ('') — see the French bundle for live examples.
#   Parameterless values are always fetched with null args and are immune.
demo.i18n.app.title=The Spring Boot Developer's Guide
demo.i18n.app.tagline=One server, every reader's language
demo.i18n.nav.topics=Topics
demo.i18n.nav.demos=Demos
demo.i18n.greeting.welcome=Welcome, {0}!
demo.i18n.greeting.returning=Welcome back, {0}! Your last visit was {1,date,medium}.
demo.i18n.messages.unread={0,choice,0#You have no unread messages|1#You have one unread message|1<You have {0} unread messages}
demo.i18n.label.locale=Language
demo.i18n.label.timezone=Time zone
demo.i18n.label.currency=Currency
demo.i18n.search.placeholder=Search the guide…
demo.i18n.error.not_found=This page does not exist: {0}
demo.i18n.error.validation=The value "{0}" is not valid.
demo.i18n.date.published=Published {0,date,long}
demo.i18n.consent.notice=This site stores only what its privacy policy names.
# The fallback-chain teaching key: it exists ONLY in this base bundle. Every
# locale's own bundle deliberately misses it, so resolving it for de, fr or
# ja walks the chain and lands here — the demo's fallback exhibit.
demo.i18n.fallback.shared=This sentence lives only in the base bundle. Every locale falls through to it.
