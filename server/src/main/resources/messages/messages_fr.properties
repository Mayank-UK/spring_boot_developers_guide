# Topic 27 — French bundle. The apostrophe trap lives here: the three
# parameterized values below carry DOUBLED apostrophes (n''existe, n''est,
# n''as) because java.text.MessageFormat treats a lone ' as the quote escape
# — with a single apostrophe, {0} inside the quoted run would never be
# substituted. French UI copy is where this bug class bites hardest.
