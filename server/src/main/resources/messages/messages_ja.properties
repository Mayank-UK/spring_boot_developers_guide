# Topic 27 — Japanese bundle, literal UTF-8 (no \uXXXX escapes needed on
# this stack). Japanese makes two teaching points all by itself: it has no
# plural morphology — the choice pattern below still needs its 0/1/many
# branches for COUNTING conventions, but the noun never changes form — and
# its typography mixes full-width punctuation (!、。), which layout testing
# must survive.
